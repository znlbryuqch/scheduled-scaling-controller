apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: scaleplans.scaling.znlbryuqch.io
spec:
  group: scaling.znlbryuqch.io
  names:
    kind: ScalePlan
    listKind: ScalePlanList
    plural: scaleplans
    singular: scaleplan
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Target
          type: string
          jsonPath: .spec.targetRef.name
        - name: Active
          type: string
          jsonPath: .status.activeWindow
        - name: Replicas
          type: integer
          jsonPath: .status.replicas
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - targetRef
              properties:
                targetRef:
                  type: object
                  required:
                    - kind
                    - name
                  properties:
                    kind:
                      type: string
                      enum:
                        - Deployment
                    name:
                      type: string
                      minLength: 1
                defaultReplicas:
                  type: integer
                  format: int32
                  minimum: 0
                windows:
                  type: array
                  maxItems: 32
                  items:
                    type: object
                    required:
                      - name
                      - schedule
                      - duration
                      - replicas
                    properties:
                      name:
                        type: string
                        minLength: 1
                      schedule:
                        type: string
                        minLength: 1
                      timeZone:
                        type: string
                        default: UTC
                      duration:
                        type: string
                        pattern: '^([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+$'
                      replicas:
                        type: integer
                        format: int32
                        minimum: 0
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                activeWindow:
                  type: string
                replicas:
                  type: integer
                  format: int32
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - reason
                      - lastTransitionTime
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time

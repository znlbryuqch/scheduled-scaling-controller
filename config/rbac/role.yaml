apiVersion: v1
kind: ServiceAccount
metadata:
  name: scheduled-scaling-controller
  namespace: scheduled-scaling-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: scheduled-scaling-controller
rules:
  - apiGroups: ["scaling.znlbryuqch.io"]
    resources: ["scaleplans"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["scaling.znlbryuqch.io"]
    resources: ["scaleplans/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: scheduled-scaling-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: scheduled-scaling-controller
subjects:
  - kind: ServiceAccount
    name: scheduled-scaling-controller
    namespace: scheduled-scaling-system
